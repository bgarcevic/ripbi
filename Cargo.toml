[workspace]
resolver = "2"
members = ["crates/ripbi-core", "crates/ripbi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/borisgarcevic/ripbi"

[workspace.dependencies]
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = "8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
