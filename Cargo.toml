[workspace]
resolver = "2"
members = ["crates/ripbi-core", "crates/ripbi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/borisgarcevic/ripbi"

[workspace.dependencies]
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = "8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rstest = "0.23"

# Ch2 of the Rust best-practices handbook: declare lints here so a local
# `cargo clippy` matches CI. `redundant_clone` and `needless_collect` are nursery
# lints, so `-D warnings` alone never runs them — and they are exactly the
# allocation mistakes this codebase is prone to.
[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 9 }
