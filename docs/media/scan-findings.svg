<text class="r a0" x="18" y="67"><tspan fill="#8a9a5b">$ </tspan><tspan fill="#f2ede4">rib scan "samples/AdventureWorks Sales.pbip" --type measure</tspan></text><rect class="c0" x="34.86" y="52" width="505.80" height="20" fill="#1c1a17"/><text class="r a1" x="18" y="87"><tspan fill="#d8d2c8">Scanning samples/AdventureWorks Sales.SemanticModel with 1 report(s)</tspan></text><text class="r a2" x="18" y="107"><tspan fill="#d8d2c8">Note: analysis covers only the ingested reports; external consumers (thin reports, Excel, XMLA) are </tspan></text><text class="r a3" x="18" y="127"><tspan fill="#d8d2c8">invisible.</tspan></text><text class="r a4" x="18" y="147"><tspan fill="#f2ede4" font-weight="700">130</tspan><tspan fill="#d8d2c8"> objects, </tspan><tspan fill="#f2ede4" font-weight="700">74</tspan><tspan fill="#d8d2c8"> reachable from </tspan><tspan fill="#f2ede4" font-weight="700">51</tspan><tspan fill="#d8d2c8"> roots, </tspan><tspan fill="#c2703d" font-weight="700">11 unused</tspan></text><text class="r a5" x="18" y="167"><tspan fill="#8a8378">(45 unused hidden by type filters)</tspan></text><text class="r a6" x="18" y="187"></text><text class="r a7" x="18" y="207"><tspan fill="#f2ede4" font-weight="700">Measures (11)</tspan></text><text class="r a8" x="18" y="227"><tspan fill="#d8d2c8">  'Sales'[Average Sales per Order]</tspan></text><text class="r a9" x="18" y="247"><tspan fill="#6e6962">    ← nothing references it</tspan></text><text class="r a10" x="18" y="267"><tspan fill="#d8d2c8">  'Sales'[Order Quantity]</tspan></text><text class="r a11" x="18" y="287"><tspan fill="#6e6962">    ← nothing references it</tspan></text><text class="r a12" x="18" y="307"><tspan fill="#d8d2c8">  'Sales'[Sales by Due Date]</tspan></text><text class="r a13" x="18" y="327"><tspan fill="#6e6962">    ← nothing references it</tspan></text><text class="r a14" x="18" y="347"><tspan fill="#d8d2c8">  'Sales'[Sales by Order Date]</tspan></text><text class="r a15" x="18" y="367"><tspan fill="#6e