version: 2
# PR titles must be conventional commits (pr-checks.yml), so every entry sets a
# commit-message prefix: "build(deps): bump ..." / "ci(deps): bump ...".
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-dependencies:
        patterns: ["*"]
  # Standalone package with its own lock file (desktop-egui/Cargo.toml).
  - package-ecosystem: cargo
    directory: /desktop-egui
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      desktop-cargo-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
