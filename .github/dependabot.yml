version: 2
# PR titles must be conventional commits (pr-checks.yml), so every entry sets a
# commit-message prefix: "build(deps): bump ..." / "ci(deps): bump ...".
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
  # Security updates only (limit 0 stops version updates); the entry exists so
  # those PRs get the conventional prefix too.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
