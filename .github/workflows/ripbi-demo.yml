# Trial of bgarcevic/ripbi-action@v1 on a real pull request (issue #143).
# Lives only on this demo branch; never merged.
name: ripbi demo
on: pull_request

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bgarcevic/ripbi-action@v1
        with:
          path: samples/AdventureWorks Sales.pbip
          comment: true
