name: PR checks

# PR titles become the squash-merge subject, and release-pr.yml derives the
# version bump from those subjects, so the title is part of the release.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # Title, body and labels arrive through env, never inline in the script:
      # a PR title is attacker-controlled text.
      - name: Check title and breaking-change approval
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style'
          pattern="^(${types})(\([a-z0-9._/,-]+\))?!?: [^ ]"
          if [[ ! "${TITLE}" =~ ${pattern} ]]; then
            echo "::error::PR title '${TITLE}' is not a conventional commit title, for example 'fix(tmdl): ...' or 'feat: ...'. Allowed types: ${types//|/, }."
            exit 1
          fi
          breaking=false
          [[ "${TITLE}" =~ ^[a-z]+(\([^\)]*\))?!: ]] && breaking=true
          grep -qE '^BREAKING[ -]CHANGE:' <<<"${BODY}" && breaking=true
          if [[ "${breaking}" == true && ",${LABELS}," != *",breaking-approved,"* ]]; then
            echo "::error::This PR is marked as a breaking change ('!' in the title or a BREAKING CHANGE: line). A maintainer must add the 'breaking-approved' label. See the versioning policy in CONTRIBUTING.md."
            exit 1
          fi

  attribution:
    name: No AI attribution
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A squash merge carries the PR body and the commit trailers into main,
      # so both are checked. Matching is case-insensitive and anchored to the
      # start of a line (the footer may lead with an emoji), so prose that
      # mentions these lines does not trip the check.
      - name: Reject AI co-author trailers and generated-with footers
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Byte-wise matching, so [^a-z0-9]* also skips a multibyte emoji.
          export LC_ALL=C
          pattern='^co-authored-by:.*noreply@anthropic\.com|^[^a-z0-9]*generated with \[?claude code'
          found=0
          if grep -inE "${pattern}" <<<"${BODY}"; then
            echo "::error::The PR description contains AI attribution. Remove the line(s) above."
            found=1
          fi
          for sha in $(git rev-list "${BASE}..${HEAD}"); do
            if git log -1 --format=%B "${sha}" | grep -iqE "${pattern}"; then
              echo "::error::Commit ${sha:0:7} contains AI attribution. Reword it, for example with 'git rebase -i' and 'reword'."
              found=1
            fi
          done
          exit "${found}"

  changelog:
    name: Changelog entry
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # User-facing changes need an [Unreleased] entry: it is what the release
      # PR publishes. Internal-only changes opt out with the skip-changelog label.
      - name: Require an [Unreleased] entry for user-facing changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [[ ",${LABELS}," == *",skip-changelog,"* ]]; then
            echo "skip-changelog label set."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}...${HEAD}")"
          # What ships: the crates, the desktop app, the action, the ADO template.
          shipped='^(crates/[^/]+/src/|desktop/src/|desktop/src-tauri/src/|ci/github-action/|templates/)'
          if ! grep -qE "${shipped}" <<<"${changed}"; then
            echo "No user-facing changes."
            exit 0
          fi
          if ! grep -qx 'CHANGELOG.md' <<<"${changed}"; then
            echo "::error::This PR changes shipped code but not CHANGELOG.md. Add an entry under [Unreleased], or have a maintainer add the 'skip-changelog' label for changes users cannot see."
            exit 1
          fi
