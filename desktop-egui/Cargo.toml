[package]
name = "ripbi-desktop-egui"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Releases ship this binary as ripbi-desktop (desktop.yml).
[[bin]]
name = "ripbi-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui_extras = "0.37"
rfd = "0.17"
ripbi-app = { path = "../crates/ripbi-app" }
ripbi-service = { path = "../crates/ripbi-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Self-update (src/update.rs), the same stack as `ripbi update`.
flate2 = "1"
semver = "1"
sha2 = "0.11"
tar = "0.4"
ureq = "3"
zip = "9"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# The demo GIF (src/demo.rs): headless rendering and encoding.
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
# The emoji and symbols eframe draws from system fonts.
egui_system_font_provider = "0.37"
gif = "0.14"
color_quant = "1.1"
image = { version = "0.25", default-features = false }
# Encodes the generated icon files; see brand.rs.
png = "0.18"
tempfile = "3"

# `cargo bundle --release` on macOS builds ripbi.app with this icon.
[package.metadata.bundle]
name = "ripbi"
identifier = "io.github.bgarcevic.ripbi"
icon = ["assets/ripbi.icns"]
category = "public.app-category.developer-tools"

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "deny"

[lints.clippy]
all = "deny"
redundant_clone = "deny"
needless_collect = "deny"

# Standalone: keeps native GUI dependencies out of CLI-only builds.
[workspace]

# `cargo run` builds debug, where the scan pipeline is ~8x slower than the
# release CLI. Optimize every dependency (ripbi, ripbi-core, egui) but keep
# this crate's own UI code quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
