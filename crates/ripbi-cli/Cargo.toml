[package]
name = "ripbi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Static analysis, linting, and tree-shaking for Power BI semantic models and DAX"
keywords = ["powerbi", "dax", "linter", "static-analysis", "tree-shaking"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]

# The published package is `ripbi`; the library keeps the crate-local name so
# the binary's imports (`use ripbi_cli::...`) are untouched by the rename.
[lib]
name = "ripbi_cli"

# The short `rib` alias is auto-discovered from src/bin/rib.rs; both binaries
# share ripbi_cli::entry::run.

[dependencies]
ripbi-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
rstest.workspace = true
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
